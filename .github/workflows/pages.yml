name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site artifact
        env:
          SITE_DIR: ${{ runner.temp }}/snehavisuals-pages
        run: |
          mkdir -p "$SITE_DIR"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='x-notes/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='beta/prd.md' \
            ./ "$SITE_DIR/"
          test -f "$SITE_DIR/index.html"
          test -f "$SITE_DIR/beta/index.html"
          test -f "$SITE_DIR/CNAME"
          test ! -e "$SITE_DIR/beta/prd.md"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/snehavisuals-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
